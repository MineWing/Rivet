# Staff command feedback supports MiniMessage.
god:
  # When false, god mode is cleared on logout and plugin shutdown.
  persist-across-reconnects: false

boss-bar:
  default-duration-seconds: 10
  default-color: purple
  # solid, segmented_6, segmented_10, segmented_12, or segmented_20
  default-style: solid

toast:
  default-type: task
  default-icon: paper

same-ip:
  format: "<#f72a4c>Online players sharing %player%'s session address:</#f72a4c> <#f72a4c>%matches%</#f72a4c>"
  disclaimer: "<white>A shared address does not prove that accounts belong to the same person; proxies and shared networks can affect results.</white>"

command-spy:
  format: "<#f72a4c>[command spy] %player%:</#f72a4c> <white>%command%</white>"

notes:
  maximum-length: 500

messages:
  tphere-usage: { enabled: true, actions: ['[message] <white>Usage: /tphere &lt;player&gt;</white>'] }
  tphere-unavailable: { enabled: true, actions: ['[message] <white>That player is not online.</white>'] }
  tphere-failed: { enabled: true, actions: ['[message] <white>Teleport failed.</white>'] }
  tphere-teleported: { enabled: true, actions: ['[message] <white>Teleported <#f72a4c>%target%</#f72a4c> to you.</white>'] }
  tphere-target: { enabled: true, actions: ['[message] <white>You were teleported to <#f72a4c>%player%</#f72a4c>.</white>'] }
  tppos-usage: { enabled: true, actions: ['[message] <white>Usage: /tppos &lt;x&gt; &lt;y&gt; &lt;z&gt;</white>'] }
  tppos-invalid: { enabled: true, actions: ['[message] <white>Coordinates must be finite numbers or relative values such as ~10.</white>'] }
  tppos-out-of-world: { enabled: true, actions: ["[message] <white>Those coordinates are outside the world's usable limits.</white>"] }
  tppos-failed: { enabled: true, actions: ['[message] <white>Teleport failed.</white>'] }
  tppos-teleported: { enabled: true, actions: ['[message] <white>Teleported to <#f72a4c>%x%, %y%, %z%</#f72a4c>.</white>'] }
  command-spy-enabled: { enabled: true, actions: ['[message] <white>Command spy enabled.</white>'] }
  command-spy-disabled: { enabled: true, actions: ['[message] <white>Command spy disabled.</white>'] }
  heal: { enabled: true, actions: ['[message] <white>Healed <#f72a4c>%target%</#f72a4c>.</white>'] }
  heal-target: { enabled: true, actions: ['[message] <white>You were healed by <#f72a4c>%player%</#f72a4c>.</white>'] }
  feed: { enabled: true, actions: ['[message] <white>Fed <#f72a4c>%target%</#f72a4c>.</white>'] }
  feed-target: { enabled: true, actions: ['[message] <white>You were fed by <#f72a4c>%player%</#f72a4c>.</white>'] }
  god-enabled: { enabled: true, actions: ['[message] <white>God mode enabled for <#f72a4c>%target%</#f72a4c>.</white>'] }
  god-disabled: { enabled: true, actions: ['[message] <white>God mode disabled for <#f72a4c>%target%</#f72a4c>.</white>'] }
  god-target-enabled: { enabled: true, actions: ['[message] <white>God mode was enabled.</white>'] }
  god-target-disabled: { enabled: true, actions: ['[message] <white>God mode was disabled.</white>'] }
  # ban-kick-message and kick-message are shown on the disconnect screen, so unlike the other
  # messages here they are plain MiniMessage strings rather than {enabled, actions} entries.
  ban-kick-message: '<white>You have been banned: <#f72a4c>%reason%</#f72a4c></white>'
  kick-message: '<white>You have been kicked: <#f72a4c>%reason%</#f72a4c></white>'
  ban-success: { enabled: true, actions: ['[message] <white>Banned <#f72a4c>%target%</#f72a4c>: <#f72a4c>%reason%</#f72a4c></white>'] }
  unban-success: { enabled: true, actions: ['[message] <white>Unbanned <#f72a4c>%target%</#f72a4c>.</white>'] }
  mute-success: { enabled: true, actions: ['[message] <white>Muted <#f72a4c>%target%</#f72a4c>: <#f72a4c>%reason%</#f72a4c></white>'] }
  mute-notification: { enabled: true, actions: ['[message] <white>You have been muted: <#f72a4c>%reason%</#f72a4c></white>'] }
  unmute-success: { enabled: true, actions: ['[message] <white>Unmuted <#f72a4c>%target%</#f72a4c>.</white>'] }
  unmute-notification: { enabled: true, actions: ['[message] <white>You have been unmuted.</white>'] }
  kick-success: { enabled: true, actions: ['[message] <white>Kicked <#f72a4c>%target%</#f72a4c>: <#f72a4c>%reason%</#f72a4c></white>'] }
  warn-success: { enabled: true, actions: ['[message] <white>Warned <#f72a4c>%target%</#f72a4c>: <#f72a4c>%reason%</#f72a4c></white>'] }
  warn-notification: { enabled: true, actions: ['[message] <#f72a4c><bold>You have been warned:</bold></#f72a4c> <white>%reason%</white>'] }
  # Shown when /ban, /tempban, /mute, /tempmute, /kick or /warn targets yourself, an operator (when
  # you are not one), or a player with rivet.moderation.exempt.
  moderation-self: { enabled: true, actions: ['[message] <white>You cannot use that moderation command on yourself.</white>'] }
  moderation-protected: { enabled: true, actions: ['[message] <white><#f72a4c>%target%</#f72a4c> is protected from moderation.</white>'] }
