# Schedule entries as "Day;HH;MM" in 24-hour server time. Day is Monday-Sunday or "Daily".
# Examples: "Monday;23;00", "Friday;02;00", "Daily;12;00".
schedules: []

# Command run on the server console once the restart countdown reaches zero.
restart-command: stop

# Delay the restart while at least this many players are online. Rivet re-checks every
# check-interval-seconds and gives up once max-delay-seconds of delay has accumulated.
delay:
  enabled: true
  player-threshold: 1
  check-interval-seconds: 60
  max-delay-seconds: 1800

# Seconds before the restart at which a warning is broadcast. 0 warns exactly at restart time.
warning-seconds:
  - 1800
  - 600
  - 300
  - 60
  - 30
  - 10
  - 5
  - 0

# Commands run on the console relative to the restart, for every scheduled restart. A zero
# or negative offset runs that many seconds before the restart; a positive offset runs that
# many seconds after the restart command is dispatched, which only happens if that command
# does not itself stop the server.
commands:
  - { offset-seconds: -300, command: save-all }

# Commands that additionally run only on the given day of the week, using the same fields.
day-commands: {}

# MiniMessage tags are supported. Available placeholders vary by message:
# warning: %seconds%, %time%, %plural%
# status: %time%, %seconds%
# delayed-for-players: %time%
# delayed: %staff%, %duration%, %reason%, %time%
# cancelled: %staff%, %reason%, %time%
messages:
  warning: { enabled: true, actions: ['[broadcast] <white>Restarting in <#f72a4c>%time%</#f72a4c>.</white>'] }
  status: { enabled: true, actions: ['[message] <white>Next restart in <#f72a4c>%time%</#f72a4c>.</white>'] }
  none-scheduled: { enabled: true, actions: ['[message] <white>No restart is currently scheduled.</white>'] }
  delayed-for-players: { enabled: true, actions: ['[broadcast] <white>The restart has been delayed because players are online. Next attempt in <#f72a4c>%time%</#f72a4c>.</white>'] }
  delayed: { enabled: true, actions: ['[broadcast] <white><#f72a4c>%staff%</#f72a4c> delayed the restart by <#f72a4c>%duration%</#f72a4c>: <#f72a4c>%reason%</#f72a4c></white>'] }
  cancelled: { enabled: true, actions: ['[broadcast] <white><#f72a4c>%staff%</#f72a4c> cancelled the next restart: <#f72a4c>%reason%</#f72a4c></white>'] }
  usage: { enabled: true, actions: ['[message] <white>Usage: /restart <check|delay|cancel></white>'] }
  delay-usage: { enabled: true, actions: ['[message] <white>Usage: /restart delay &lt;duration&gt; [reason]</white>'] }
  invalid-duration: { enabled: true, actions: ['[message] <white>Duration must look like 30m, 1h, or 1d12h.</white>'] }
  no-permission: { enabled: true, actions: ['[message] <white>You do not have permission to manage restarts.</white>'] }
