# Set to 0 to disable automatic AFK detection.
automatic-after-minutes: 10
exclude-from-sleep: true

indicator:
  enabled: true
  format: " <white>[AFK]</white>"

messages:
  afk: { enabled: true, actions: ['[message] <white>%player% is now AFK.</white>'] }
  afk-with-reason: { enabled: true, actions: ['[message] <white>%player% is now AFK: <#f72a4c>%reason%</#f72a4c></white>'] }
  return: { enabled: true, actions: ['[message] <white>%player% is no longer AFK.</white>'] }
  # Sent only to a muted player who gave /afk a reason; they still go AFK, but the reason is dropped.
  reason-hidden-muted: { enabled: true, actions: ['[message] <white>Your AFK reason was not shown because you are muted.</white>'] }
