# Entity types that can never be captured, even with rivet.eggcapture.bypass.
# Accepts names such as IRON_GOLEM or minecraft:iron_golem.
blocked-types:
  - WITHER
  - ENDER_DRAGON
  - WARDEN
  - ELDER_GUARDIAN
  - VILLAGER
  - ZOMBIE_VILLAGER
  - WANDERING_TRADER
  - IRON_GOLEM
  - PIGLIN_BRUTE
  - SHULKER
  - EVOKER
  - GIANT
  - ILLUSIONER

# When non-empty, only these entity types can be captured (blocked-types still applies).
# Leave empty to allow every type that is not blocked.
allowed-types: []

messages:
  cannot-capture:
    enabled: true
    actions:
      - '[actionbar] <white>That creature cannot be captured.</white>'
  cannot-use-on-spawner:
    enabled: true
    actions:
      - '[actionbar] <white>Captured creatures cannot be used on spawners.</white>'

captured-egg:
  name: "<white>Captured <#f72a4c>%mob%</#f72a4c></white>"
  lore:
    - '<dark_gray>│ Contains the original creature.</dark_gray>'

effects:
  start-sound:
    enabled: true
    name: block.trial_spawner.ominous_activate
    volume: 0.8
    pitch: 1.35
  completion-sound:
    enabled: true
    name: entity.firework_rocket.large_blast
    volume: 1.0
    pitch: 0.8
  received-sound:
    enabled: true
    name: entity.allay.item_given
    volume: 0.8
    pitch: 1.3
  particles:
    enabled: true
    vortex-enabled: true
    vortex-first-color: "#55FFFF"
    vortex-second-color: "#BE55FF"
    vortex-size: 1.25
    portal-enabled: true
    portal-name: reverse_portal
    portal-count: 8
    completion-flash-enabled: true
    completion-flash-count: 1
    completion-explosion-enabled: true
    completion-explosion-count: 4
    completion-sparks-enabled: true
    completion-sparks-count: 45
    completion-portals-enabled: true
    completion-portals-count: 70
